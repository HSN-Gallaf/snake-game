<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>
  </head>
  <body>
    <!-- Game Board Container -->
    <div class="container">
      <div id="switch-mode-container">
        <button id="theme-toggle" aria-label="Toggle dark mode">
          Switch Theme
        </button>
      </div>
      <div id="score-div">
        <p id="current-score">Score:</p>
        <p id="highest-score">Highest Score:</p>
      </div>
      <div class="game-board"></div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over-container">
      <div class="game-over">
        <h1 id="game-over-text">Game Over!</h1>
        <p id="score-text">Your Score:</p>
        <button id="restart-btn" onclick="restartGame()">Restart Game</button>
      </div>
    </div>

    <div class="level-container">
      <div class="levels">
        <p>Chose a Level</p>
        <button class="levels-buttons" onclick="initGame(150)">Easy</button>
        <button class="levels-buttons" onclick="initGame(100)">Medium</button>
        <button class="levels-buttons" onclick="initGame(70)">Hard</button>
      </div>
    </div>
  </body>
</html>
